interface:
  display_name: "Ticket Batch Intake"
  short_description: "Normalize ticket batches into evidence-based plans, summaries, contracts, and handoffs"
  default_prompt: "Use $ticket-batch-intake to resolve ticket IDs with valid tool parameters, gather independent evidence concurrently, recover material copied-card history when comment-only results are incomplete, inspect visual attachments through an authenticated read-only Chrome fallback when needed, sanitize exposed secrets, detect prior-agent changes, and hand the normalized plan to the correct execution owner."

policy:
  allow_implicit_invocation: true
