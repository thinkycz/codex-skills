interface:
  display_name: "Verification Before Completion"
  short_description: "Require fresh, race-safe lifecycle evidence"
  default_prompt: "Use $verification-before-completion to choose the cheapest sufficient evidence layers, serialize checks that share mutable state, inspect rendered output when relevant, verify the exact installed or deployed path for runtime claims, and report missing evidence precisely."

policy:
  allow_implicit_invocation: true
