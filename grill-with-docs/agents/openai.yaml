interface:
  display_name: "Grill With Docs"
  short_description: "Stress-test plans deeply without uncontrolled scope growth"
  default_prompt: "Use $grill-with-docs to challenge this plan one material question at a time against the repo and domain docs, preserve the requested MVP boundary, checkpoint scope expansion, and separate accepted safeguards from deferred enhancements before implementation."

policy:
  allow_implicit_invocation: true
