interface:
  display_name: "Api Contract Review"
  short_description: "Review API contracts and missing-consumer handoffs before integration starts"
  default_prompt: "Use $api-contract-review to compare frontend/mobile expectations and the real serialized transport shape against contract evidence, check omitted versus null fields, scalar and enum conversion, multipart payloads, and internal helper-field leakage, classify mismatches, and recommend the safest next action before implementation."

policy:
  allow_implicit_invocation: true
